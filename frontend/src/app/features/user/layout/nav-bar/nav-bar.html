<aside class="sidebar hidden lg:flex" aria-label="User sidebar">
  <div class="h-20 flex items-center px-8 border-b border-slate-50/50">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-lg bg-[#0e1d2d] flex items-center justify-center text-white shadow-lg shadow-[#5802f7]/30">
        <img src="logoApp.png" alt="Logo" class="w-9 h-9 object-contain" />
      </div>
      <span class="text-[#1a1a1a] text-xl font-extrabold tracking-tight">Pay-QR</span>
    </div>
  </div>

  <nav class="flex-1 px-4 py-6 space-y-1" aria-label="Main navigation">
    <a
      class="nav-item"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>

    @if (!isEnterpriseUser()) {
      <a class="nav-item" routerLink="/wallet" routerLinkActive="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-5"/><path d="M16 12h5v4h-5a2 2 0 010-4z"/></svg>
        Wallet
      </a>
    }

    <a class="nav-item" routerLink="/managed-qr" routerLinkActive="active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h.01M14 17h.01M17 14h.01M17 17h.01"/></svg>
      QR Code
    </a>
  </nav>

  <div class="flex items-center gap-3 p-4 border-t border-gray-100 mt-4">
    <div class="w-10 h-10 rounded-full bg-linear-to-br from-[#000000] to-[#fcfcfc] flex items-center justify-center text-white font-bold text-sm">
      {{ userInitials() }}
    </div>
    <div class="min-w-0 flex-1">
      <p class="font-semibold text-gray-900 text-sm truncate">{{ userDisplayName() }}</p>
      <p class="text-gray-400 text-xs">{{ currentUser()?.role }}</p>
    </div>
    <button class="ml-auto text-gray-400 hover:text-gray-600" (click)="logout()" title="Logout" aria-label="Logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</aside>

  <div class="flex justify-between items-center mb-6 px-4 pt-4 lg:hidden">
    <span style="font-family:'Syne',sans-serif;" class="font-bold text-lg text-gray-900">Pay-QR</span>
    <button class="bg-white p-2.5 rounded-full shadow-md hover:shadow-lg transition-all" (click)="menuOpen.set(true)" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

@if (menuOpen()) {
  <div class="fixed inset-0 z-50 lg:hidden">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" (click)="closeMenu()"></div>
    <aside class="absolute left-0 top-0 h-full w-72 bg-white shadow-2xl flex flex-col">
      <div class="h-20 flex items-center justify-between px-6 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-[#0e1d2d] flex items-center justify-center text-white shadow-lg shadow-[#5802f7]/30">
            <img src="logoApp.png" alt="Logo" class="w-8 h-8 object-contain" />
          </div>
          <span class="text-[#1a1a1a] text-lg font-extrabold tracking-tight">Pay-QR</span>
        </div>
        <button class="p-2 rounded-full hover:bg-gray-100 text-gray-500" (click)="closeMenu()" aria-label="Close menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-1" aria-label="Mobile navigation">
        <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>

        @if (!isEnterpriseUser()) {
          <a class="nav-item" routerLink="/wallet" routerLinkActive="active" (click)="closeMenu()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2v-5"/><path d="M16 12h5v4h-5a2 2 0 010-4z"/></svg>
            Wallet
          </a>
        }

        <a class="nav-item" routerLink="/managed-qr" routerLinkActive="active" (click)="closeMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h.01M14 17h.01M17 14h.01M17 17h.01"/></svg>
          QR Code
        </a>
      </nav>

      <div class="flex items-center gap-3 p-4 border-t border-gray-100">
        <div class="w-10 h-10 rounded-full bg-linear-to-br from-[#000000] to-[#fcfcfc] flex items-center justify-center text-white font-bold text-sm shrink-0">
          {{ userInitials() }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="font-semibold text-gray-900 text-sm truncate">{{ userDisplayName() }}</p>
          <p class="text-gray-400 text-xs">{{ currentUser()?.role }}</p>
        </div>
        <button class="ml-auto text-gray-400 hover:text-gray-600" (click)="logout()" title="Logout" aria-label="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>
  </div>
}
