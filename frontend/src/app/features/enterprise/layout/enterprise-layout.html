<div class="flex h-screen overflow-hidden bg-slate-50 text-slate-600 font-sans antialiased">

  <aside
    [class.-translate-x-full]="!sidebarOpen()"
    class="fixed inset-y-0 left-0 z-50 w-64 bg-white/95 backdrop-blur-xl border-r border-slate-100 flex flex-col justify-between shadow-[4px_0_24px_rgba(0,0,0,0.04)] transition-transform duration-300 md:relative md:translate-x-0 md:shrink-0"
  >
  <div class="h-20 flex items-center px-8 border-b border-slate-50/50">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-lg bg-[#0e1d2d] flex items-center justify-center text-white shadow-lg shadow-[#5802f7]/30">
        <img src="logoApp.png" alt="Logo" class="w-9 h-9 object-contain" />
      </div>
      <span class="text-[#1a1a1a] text-xl font-extrabold tracking-tight">Pay-QR</span>
    </div>
  </div>

    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto" aria-label="Enterprise navigation">
      <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Overview</p>

      <a
        [routerLink]="['dashboard']"
        routerLinkActive="text-indigo-600 bg-indigo-50 font-medium"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-all duration-200"
        (click)="closeSidebar()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
        </svg>
        <span>Dashboard</span>
      </a>

      <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider mt-6 mb-4">Management</p>

      <a
        [routerLink]="['users']"
        routerLinkActive="text-indigo-600 bg-indigo-50 font-medium"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-all duration-200"
        (click)="closeSidebar()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
        </svg>
        <span>Users</span>
      </a>

      <a
        [routerLink]="['funding']"
        routerLinkActive="text-indigo-600 bg-indigo-50 font-medium"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-all duration-200"
        (click)="closeSidebar()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
        </svg>
        <span>Account Funding</span>
      </a>

      <a
        [routerLink]="['wallet']"
        routerLinkActive="text-indigo-600 bg-indigo-50 font-medium"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-indigo-600 transition-all duration-200"
        (click)="closeSidebar()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18-3H3m7.5 3h3M12 3v.75" />
        </svg>
        <span>Wallet</span>
      </a>
    </nav>

    <div class="p-4 border-t border-slate-50 space-y-1">

      <a
        routerLink="/login"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-rose-500 transition-all duration-200 text-sm"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
        </svg>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 md:hidden" (click)="closeSidebar()" role="presentation"></div>
  }

  <main class="flex-1 flex flex-col relative overflow-y-auto overflow-x-hidden">

    <header class="sticky top-0 z-30 flex h-20 items-center justify-between px-6 md:px-10 bg-white/70 backdrop-blur-xl border-b border-slate-100 shadow-sm">
      <div class="flex items-center gap-4">
    <div class="flex justify-between items-center mb-6 px-4 pt-4 lg:hidden">
    <button class="bg-white p-2.5 rounded-full shadow-md hover:shadow-lg transition-all" (click)="toggleSidebar()" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
        <nav class="hidden sm:flex items-center text-sm font-medium text-slate-400" aria-label="Breadcrumb">
          <span class="text-[#1a1a1a] font-semibold truncate max-w-40">{{ enterpriseName() }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="mx-2 w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          <span class="text-indigo-600">Portal</span>
        </nav>
      </div>

      <div class="flex items-center gap-3 pl-4 border-l border-slate-200 cursor-pointer group">
        <div class="text-right hidden md:block">
          <p class="text-sm font-semibold text-[#1a1a1a] group-hover:text-indigo-600 transition-colors truncate max-w-36">{{ enterpriseName() }}</p>
          <p class="text-xs text-slate-400">Enterprise Manager</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-linear-to-tr from-[#000000] to-[#b7b9c0] flex items-center justify-center text-[#ffffff] font-bold text-sm shrink-0" aria-hidden="true">
          {{ enterpriseName()[0] || 'E' }}
        </div>
      </div>
    </header>

    <div class="flex-1 p-4 sm:p-6 lg:p-10">
      <router-outlet />
    </div>

  </main>
</div>
