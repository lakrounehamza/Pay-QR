spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ==========================================
# Ollama AI Configuration (Local LLM/Vision)
# ==========================================
ollama:
  api:
    url: ${OLLAMA_URL:http://localhost:11434}
  # Options: llava:7b | llava:13b | llava:34b | bakllava:7b
  model: ${OLLAMA_MODEL:llava:7b}
  timeout: 120000
  enabled: true

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  public-key: ${STRIPE_PUBLIC_KEY:}
  currency: ${STRIPE_CURRENCY:eur}

sms:
  # Provider: "console" (logs only), "twilio" (real SMS), or "ovh" (real SMS)
  provider: ${SMS_PROVIDER:twilio}

  # Dev mode: true = print in logs only, false = send real SMS
  dev-mode: ${SMS_DEV_MODE:false}

  # Sender name shown on recipient's phone (max 11 alphanumeric chars)
  sender: ${SMS_SENDER:PayQR}

  # Twilio configuration
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}

otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}