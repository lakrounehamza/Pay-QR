spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pyqr}
    username: ${DB_USERNAME:username}
    password: ${DB_PASSWORD:userpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:lakrounehamza10@gmail.com}
    password: ${MAIL_PASSWORD:pphodrxepirbcqjn}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
