databaseChangeLog:
  - changeSet:
      id: 01
      author: dev
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        and:
          - not:
              tableExists:
                tableName: enterprise
      changes:
        - createTable:
            tableName: enterprise
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nom
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: telephone
                  type: VARCHAR(100)
              - column:
                  name: statut
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: DATETIME
