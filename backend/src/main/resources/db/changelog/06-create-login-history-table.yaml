databaseChangeLog:
  - changeSet:
      id: 06
      author: dev
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        and:
          - not:
              tableExists:
                tableName: login_history
      changes:
        - createTable:
            tableName: login_history
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ip_address
                  type: VARCHAR(100)
              - column:
                  name: device
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: user_id
                  type: VARCHAR(36)
