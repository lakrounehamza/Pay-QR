databaseChangeLog:
  - changeSet:
      id: 02
      author: dev
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        and:
          - not:
              tableExists:
                tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: nom
                  type: VARCHAR(255)
              - column:
                  name: prenom
                  type: VARCHAR(255)
              - column:
                  name: telephone
                  type: VARCHAR(50)
                  constraints:
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: enterprise_id
                  type: VARCHAR(36)
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
